name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (for lru-dict fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run linter
        run: ruff check src tests

      - name: Type check
        run: mypy src/bonnet
        continue-on-error: true  # LSP-only on dev machine; loosen strictness

      - name: Import smoke test
        run: |
          python -c "from bonnet.cli import cli; from bonnet.scoring.scorer import score_pair; from bonnet.pipeline import run_scan; print('imports OK')"