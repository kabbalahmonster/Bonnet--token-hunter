[project]
name = "bonnet"
version = "0.1.0"
description = "Bonnet — token hunter for Robinhood Chain. Discovers, scores, and alerts on new and existing tokens by volume, volatility, and rug resistance."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<25",
    "tenacity>=8.2,<9",
    "python-dotenv>=1.0,<2",
    "click>=8.1,<9",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<22"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
bonnet = "bonnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonnet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]